<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Open Graph card, 1200x630. Rendered headless (Chromium screenshot, JPEG) to og-image.jpg.
       Only facts from the page's own metadata are drawn: the name, one line, the address. No stats, no claims. -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: 'Archivo', sans-serif;
      background-color: #070908;
      background-image: linear-gradient(#141816 1px, transparent 1px), linear-gradient(90deg, #141816 1px, transparent 1px);
      background-size: 40px 40px; color: #F1ECE2;
    }
    .eyebrow { position: absolute; left: 72px; top: 96px; font-weight: 600; font-size: 20px; letter-spacing: .14em; color: #7BC47F; }
    .name { position: absolute; left: 66px; top: 132px; font-weight: 800; font-size: 150px; letter-spacing: -.04em; line-height: 1; }
    .name i { font-style: normal; color: #7BC47F; }
    .line { position: absolute; left: 72px; top: 318px; font-size: 34px; color: #D9D3C7; max-width: 640px; line-height: 1.25; }
    .foot { position: absolute; left: 72px; bottom: 64px; font-weight: 600; font-size: 20px; color: #9A948A; }
    svg { position: absolute; right: 0; top: 0; }
  </style>
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630">
    <g fill="#121110" stroke="#2B2824" stroke-width="2"><rect x="740" y="110" width="180" height="180" rx="4"/><rect x="940" y="110" width="180" height="180" rx="4"/><rect x="740" y="310" width="180" height="180" rx="4"/></g>
    <path d="M770 260 C 800 200, 840 230, 860 180 S 900 140, 890 135" fill="none" stroke="#7BC47F" stroke-width="4" stroke-linecap="round"/>
    <g fill="#7BC47F"><circle cx="800" cy="215" r="7"/><circle cx="860" cy="180" r="7"/></g><rect x="880" y="235" width="16" height="16" fill="#E2553A"/>
    <rect x="990" y="135" width="80" height="120" rx="4" fill="#F1ECE2"/><text x="1030" y="215" text-anchor="middle" font-family="Archivo" font-size="48" fill="#B23A22">♥</text>
    <g><rect x="770" y="340" width="56" height="56" rx="3" fill="#121110" stroke="#9A948A" stroke-width="2"/><rect x="834" y="340" width="56" height="56" rx="3" fill="#7BC47F"/><rect x="770" y="404" width="56" height="56" rx="3" fill="#121110" stroke="#9A948A" stroke-width="2"/><text x="798" y="378" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="24" fill="#F1ECE2">1</text><text x="862" y="378" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="24" fill="#050707">2</text><text x="798" y="442" text-anchor="middle" font-family="Archivo" font-weight="800" font-size="24" fill="#F1ECE2">3</text></g>
  </svg>
  <div class="eyebrow">BUTTS STUDIOS</div>
  <div class="name">Games<i>.</i></div>
  <div class="line">Browser games: Glowgrid, Card Battle and Sliding Numbers.</div>
  <div class="foot">games.buttsstudios.com</div>
</body>
</html>
